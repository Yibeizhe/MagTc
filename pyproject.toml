[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magtc"
version = "1.0.0"
description = "Classical Monte Carlo Curie/Neel temperatures of two-dimensional magnets (JCP 2026 protocol)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.20", "pyyaml>=5.1"]

[project.optional-dependencies]
fast = ["numba>=0.55"]
plot = ["matplotlib>=3.3"]
test = ["pytest>=7"]

[project.scripts]
magtc = "magtc.cli:main"

[project.urls]
Homepage = "https://github.com/Yibeizhe/MagTc"

[tool.setuptools]
packages = ["magtc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running checks (deselect with -m 'not slow')"]
