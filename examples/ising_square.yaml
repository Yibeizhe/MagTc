# 2D square-lattice Ising model, J = 1 meV.  Onsager: T_c = 2J/(k_B ln(1+sqrt 2)) = 26.333 K.
name: ising_square
reference: "L. Onsager, Phys. Rev. 65, 117 (1944), doi:10.1103/PhysRev.65.117"
spin: ising
structure: {dim: 2, lattice: [[1, 0, 0], [0, 1, 0], [0, 0, 1]], sites: [{frac: [0, 0, 0]}]}
interactions:
  - {name: J1, J: 1.0, shell: 1}
mc: {L: 32, Tmax: 30.0, Tmin: 23.0, step: 0.5, ntherm: 5000, nmeas: 50000, every: 10, nseeds: 8,
     moves: {metropolis: uniform, wolff: 2}}
