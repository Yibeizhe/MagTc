# Monolayer VN, b = 2.7342 A: parameters of vn_tc_batch_L50_prod.py (TABLE_S3, first row),
# published in J. Chem. Phys. 2026 (monolayer VN).  JCP T_C = 419.7 K.
# Ja -> bond (+-1, 0), Jb -> (0, +-1), Jab -> diagonals; D = MAE_perp / 4 = 0.5711/4 meV written as
# K = (D, D, 0), equal to -D (S^z)^2 up to a constant.
name: VN_b2p7342
description: Monolayer VN at b = 2.7342 A, rectangular J1-J3 + easy-axis anisotropy (JCP 2026 protocol)
reference: "Monolayer VN, J. Chem. Phys. (2026); TABLE_S3 of vn_tc_batch_L50_prod.py, github.com/Yibeizhe/MagTc"
spin: heisenberg
structure:
  dim: 2
  sites: [{label: V, frac: [0, 0, 0]}]      # lattice vectors not needed: bonds are explicit
interactions:                                # meV, J > 0 FM, each pair once: [s1, s2, da, db, dc]
  - {name: Ja,  J: 32.36, bonds: [[0, 0, 1, 0, 0]]}
  - {name: Jb,  J: -7.74, bonds: [[0, 0, 0, 1, 0]]}
  - {name: Jab, J: 32.51, bonds: [[0, 0, 1, 1, 0], [0, 0, 1, -1, 0]]}
anisotropy:
  K: [0.142775, 0.142775, 0.0]
order: FM
mc:                                          # JCP 2026 protocol (the defaults, written out)
  L: 50
  Tmax: 480
  Tmin: 360
  step: 5
  ntherm: 100000
  nmeas: 200000
  every: 20
  nseeds: 8
  seed0: 20260616
  protocol: anneal
  moves: {metropolis: uniform, overrelax: 0, wolff: 0}
